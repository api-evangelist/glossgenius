aid: glossgenius
name: GlossGenius
description: 'GlossGenius is a business management platform for the beauty, wellness, and
  health services industry, combining appointment scheduling, integrated payment processing
  (flat 2.6% rate), point of sale, marketing, client management, staff and payroll tools,
  and AI agents that answer booking inquiries and follow up with clients. It serves solo
  professionals and multi-location businesses such as salons, spas, barbershops, and
  medspas, powering more than 120,000 appointment-based businesses. GlossGenius was
  surfaced as a portfolio company of Bessemer Venture Partners and Techstars and added
  to the API Evangelist network. As of this enrichment pass GlossGenius publishes no
  public developer API, OpenAPI, SDKs, MCP server, or developer portal; this profile
  captures the company identity and public link surface only.'
